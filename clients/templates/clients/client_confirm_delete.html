{% extends "clients/base.html" %}

{% block content %}
  <h1>Удалить клиента?</h1>
  <p>Вы уверены, что хотите удалить клиента «{{ object }}»?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit">Да, удалить</button>
  </form>
  <a href="{% url 'client_detail' object.pk %}">Отмена</a>
{% endblock %}
