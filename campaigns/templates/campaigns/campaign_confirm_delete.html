{% extends "campaigns/base.html" %}

{% block content %}
  <h1>Удалить кампанию?</h1>
  <p>Вы уверены, что хотите удалить кампанию «{{ object.name }}»?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit">Да, удалить</button>
  </form>
  <a href="{% url 'campaign_detail' object.pk %}">Отмена</a>
{% endblock %}
