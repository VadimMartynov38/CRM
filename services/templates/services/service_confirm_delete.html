{% extends "services/base.html" %}

{% block content %}
  <h1>Удалить услугу?</h1>
  <p>Вы уверены, что хотите удалить услугу «{{ object.name }}»?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit">Да, удалить</button>
  </form>
  <a href="{% url 'service_detail' object.pk %}">Отмена</a>
{% endblock %}
