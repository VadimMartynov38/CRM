{% extends "contracts/base.html" %}

{% block content %}
  <h1>Удалить договор?</h1>
  <p>Вы уверены, что хотите удалить договор «{{ object.number }} — {{ object.title }}»?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit">Да, удалить</button>
  </form>
  <a href="{% url 'contract_detail' object.pk %}">Отмена</a>
{% endblock %}
