{% extends "contracts/base.html" %}

{% block content %}
  <h1>{% if object %}Редактировать договор{% else %}Создать договор{% endif %}</h1>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Сохранить</button>
  </form>
  <a href="{% url 'contract_list' %}">Отмена</a>
{% endblock %}
