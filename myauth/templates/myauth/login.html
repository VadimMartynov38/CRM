{% extends 'myauth/base.html' %}

{% block title %}
  Login
{% endblock %}

{% block body %}

  <form method="post">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">Login</button>

  </form>
  <p>
    Нет аккаунта?
    <a href="{% url 'myauth:register' %}" class="btn btn-link">Register</a>
  </p>
{% endblock %}
