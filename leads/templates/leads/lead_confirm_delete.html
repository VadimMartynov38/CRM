{% extends "leads/base.html" %}

{% block content %}
  <h1>Удалить лид?</h1>
  <p>Вы уверены, что хотите удалить лид «{{ object.first_name }} {{ object.last_name|default:'' }}»?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit">Да, удалить</button>
  </form>
  <a href="{% url 'lead_detail' object.pk %}">Отмена</a>
{% endblock %}
